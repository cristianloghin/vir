name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write  # Required for OIDC
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Set package version from release tag
        id: get_version
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          prerelease="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          build='[0-9A-Za-z-]+'
          tag_pattern="^v${number}\.${number}\.${number}(-${prerelease}(\.${prerelease})*)?(\+${build}(\.${build})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo 'Expected a release tag in v<semver> format.' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_OUTPUT"
      
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
